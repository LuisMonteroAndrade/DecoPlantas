<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío 1</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>

    <section class="seccion-principal">
        <h1 class="titulo"> 
            DecoPlantas
            <span style="display: block; font-size: 16px; color: rgb(0, 0, 0);">
                Plantas decoDisco, tu lugar de complas de albunes
            </span>
        </h1>
        <img class="img" src="Imagenes/Linkin 1.jpg" alt="fondo">
    </section>

    <section class="seccion-producto">

        <div class="producto">
            <img class="img1" src="Imagenes/Linkin 2.jpg">
            <div class="texto">
                <p class="parrafo1">Albun 1</p>
                <p class="parrafo2">Precio: $2.500</p>
            </div>
        </div>

        <div class="producto">
            <img class="img2" src="/Imagenes/Linkin 3.jpg">
            <div class="texto">
                <p class="parrafo3">Album 2</p>
                <p class="parrafo4">Precio: $3.500</p>
            </div>
        </div>

        <div class="producto">
            <img class="img3" src="Imagenes/Linkin 4.webp" alt="Planta 3">
            <div class="texto">
                <p class="parrafo5">Album 3</p>
                <p class="parrafo6">Precio: $4.500</p>
            </div>
        </div>
    </section>

    <section class="pie-de-pagina">
        <h2 class="pie">© 2024 DecoDisco</h2>
    </section>
